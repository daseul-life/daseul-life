    <style>
      :root {
        --paper: #fff8ef;
        --paper-deep: #fff1e8;
        --paper-soft: #fffaf5;
        --ink: #4b403b;
        --muted: #8b7d75;
        --line: #ead9cf;
        --pink: #dca39d;
        --pink-deep: #c8847d;
        --sage: #a9c7a2;
        --sage-deep: #6f9770;
        --sage-soft: #eef6eb;
        --profile-beige: #e7c4a4;

        font-family:
          "Gowun Dodum",
          "Pretendard",
          "Apple SD Gothic Neo",
          "Malgun Gothic",
          system-ui,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        scroll-behavior: smooth;
        background: var(--paper);
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);

        background:
          radial-gradient(
            circle at 12% 0%,
            rgba(220, 163, 157, 0.18),
            transparent 32%
          ),
          radial-gradient(
            circle at 100% 88%,
            rgba(169, 199, 162, 0.2),
            transparent 30%
          ),
          linear-gradient(
            180deg,
            #fff8ef 0%,
            #fff5ee 44%,
            #fff8ef 100%
          );

        font-size: 16px;
        line-height: 1.72;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a,
      button {
        -webkit-tap-highlight-color: transparent;
      }

      .page {
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 28px 18px 42px;
      }

      .shell {
        width: min(100%, 480px);
        margin: 0 auto;
      }

      /* =========================
         HERO
      ========================= */

      .hero {
        min-height: calc(100vh - 56px);
        display: grid;
        align-content: center;
        justify-items: center;
        padding: 14px 0 30px;
        text-align: center;
      }

      .profile-frame {
        width: 124px;
        height: 124px;
        display: grid;
        place-items: center;
        margin: 0 auto 20px;
        padding: 5px;
        overflow: hidden;

        border: 1px solid rgba(220, 163, 157, 0.54);
        border-radius: 50%;

        background:
          linear-gradient(
              var(--profile-beige),
              var(--profile-beige)
            )
            padding-box,
          linear-gradient(
              135deg,
              rgba(220, 163, 157, 0.72),
              rgba(169, 199, 162, 0.66)
            )
            border-box;

        box-shadow:
          0 16px 38px rgba(149, 112, 98, 0.13);
      }

      .profile-image {
        width: 100%;
        height: 100%;
        display: block;
        border-radius: 50%;

        object-fit: cover;
        object-position: center;

        background: var(--profile-beige);

        user-select: none;
        -webkit-user-drag: none;
      }

      .name {
        margin: 0;
        font-size: 2.05rem;
        font-weight: 800;
        letter-spacing: 0;
      }

      .intro {
        max-width: 330px;
        margin: 12px auto 0;

        color: var(--muted);
        font-size: 1rem;
        line-height: 1.75;

        word-break: keep-all;
      }

      .hero-divider {
        width: 72px;
        height: 1px;
        margin: 24px auto;
        background: var(--line);
      }

      .primary-link {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;

        width: 100%;
        min-height: 58px;

        border-radius: 19px;

        color: #fff;

        background:
          linear-gradient(
            135deg,
            var(--pink) 0%,
            var(--pink-deep) 100%
          );

        font-size: 1.06rem;
        font-weight: 800;

        box-shadow:
          0 14px 28px rgba(200, 132, 125, 0.2);

        transition:
          transform 160ms ease,
          box-shadow 160ms ease;
      }

      .primary-note {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.55;
        word-break: keep-all;
      }

      .primary-link:hover,
      .primary-link:focus-visible,
      .link-card:hover,
      .link-card:focus-visible,
      .sentence-card:hover,
      .sentence-card:focus-visible,
      .story-card:hover,
      .story-card:focus-visible {
        transform: translateY(-2px);
      }

      /* =========================
         SECTION
      ========================= */

      .section {
        width: 100%;
        padding: 30px 0;
        border-top: 1px solid var(--line);
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;

        margin: 0 0 16px;

        color: var(--pink-deep);
        font-size: 1.15rem;
        font-weight: 800;
        text-align: center;
      }

      /* =========================
         ABOUT
      ========================= */

      .about-text {
        display: grid;
        gap: 12px;

        color: #62544e;
        text-align: center;
        word-break: keep-all;
      }

      .about-text p {
        margin: 0;
      }

      /* =========================
         STORY IMAGE CARDS
      ========================= */

      .story-grid {
        display: grid;
        gap: 14px;
      }

      .story-card {
        display: block;
        overflow: hidden;

        border: 1px solid rgba(234, 217, 207, 0.92);
        border-radius: 22px;

        background: rgba(255, 253, 249, 0.72);

        box-shadow:
          0 10px 25px rgba(149, 112, 98, 0.06);

        transition:
          transform 160ms ease,
          border-color 160ms ease,
          box-shadow 160ms ease;
      }

      .story-card:hover,
      .story-card:focus-visible {
        border-color: rgba(220, 163, 157, 0.7);

        box-shadow:
          0 14px 30px rgba(149, 112, 98, 0.1);
      }

      .story-image-wrap {
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background: var(--paper-deep);
      }

      .story-image {
        width: 100%;
        height: 100%;
        display: block;

        object-fit: cover;
        object-position: center;

        transition: transform 300ms ease;
      }

      .story-card:hover .story-image,
      .story-card:focus-visible .story-image {
        transform: scale(1.025);
      }

      .story-copy {
        padding: 16px 17px 17px;
      }

      .story-copy strong {
        display: block;
        font-size: 1.02rem;
        line-height: 1.45;
      }

      .story-copy span {
        display: block;
        margin-top: 5px;

        color: var(--muted);
        font-size: 0.83rem;
        line-height: 1.5;

        word-break: keep-all;
      }

      .story-more {
        margin: 14px 0 0;

        color: var(--muted);
        font-size: 0.8rem;
        text-align: center;
      }

      /* =========================
         LINK CARDS
      ========================= */

      .link-list,
      .sentence-grid {
        width: 100%;
        display: grid;
        gap: 12px;
        margin: 0 auto;
      }

      .link-card {
        display: grid;
        grid-template-columns: 44px 1fr 20px;
        align-items: center;
        gap: 14px;

        min-height: 66px;
        padding: 12px 14px 12px 12px;

        border: 1px solid rgba(234, 217, 207, 0.92);
        border-radius: 20px;

        background: rgba(255, 253, 249, 0.52);

        transition:
          transform 160ms ease,
          border-color 160ms ease,
          background 160ms ease;
      }

      .link-card.featured {
        min-height: 76px;

        border-color: rgba(220, 163, 157, 0.62);

        background:
          linear-gradient(
            135deg,
            rgba(255, 241, 235, 0.84) 0%,
            rgba(255, 249, 244, 0.9) 100%
          );

        box-shadow:
          0 14px 30px rgba(200, 132, 125, 0.12);
      }

      .link-card.youtube {
        border-color: rgba(220, 163, 157, 0.48);

        background:
          linear-gradient(
            135deg,
            rgba(255, 246, 241, 0.92) 0%,
            rgba(255, 252, 248, 0.96) 100%
          );
      }

      .link-card.youtube .icon {
        color: var(--pink-deep);
        background: #fff0ec;
      }

      .link-card:hover,
      .link-card:focus-visible {
        border-color: rgba(220, 163, 157, 0.7);
        background: rgba(255, 253, 249, 0.88);
      }

      .icon {
        width: 44px;
        height: 44px;

        display: grid;
        place-items: center;

        border-radius: 15px;

        color: var(--pink-deep);
        background: var(--paper-deep);

        font-weight: 800;
      }

      .icon.sage {
        color: var(--sage-deep);
        background: var(--sage-soft);
      }

      .icon.youtube-icon {
        color: var(--pink-deep);
        background: #fff0ec;
      }

      .icon svg {
        width: 23px;
        height: 23px;
      }

      .link-copy {
        min-width: 0;
      }

      .link-copy strong {
        display: block;
        font-size: 1rem;
        line-height: 1.35;
      }

      .link-card.featured .link-copy strong {
        font-size: 1.08rem;
      }

      .link-copy span {
        display: block;
        margin-top: 2px;

        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.45;

        word-break: keep-all;
      }

      .arrow {
        color: #b7a8a0;
        font-size: 1.2rem;
      }

      /* =========================
         YOUTUBE
      ========================= */

      .watch-intro {
        margin: -4px 8px 14px;

        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.65;

        text-align: center;
        word-break: keep-all;
      }

      .watch-note {
        margin: 10px 4px 0;

        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.55;

        text-align: center;
      }

      /* =========================
         SENTENCES
      ========================= */

      .sentence-card {
        display: block;
        width: 100%;

        padding: 19px 18px 18px;

        border: 1px solid rgba(234, 217, 207, 0.9);
        border-radius: 22px;

        background: rgba(255, 253, 249, 0.48);

        text-align: center;

        transition:
          transform 160ms ease,
          border-color 160ms ease,
          background 160ms ease;
      }

      .sentence-card:hover,
      .sentence-card:focus-visible {
        border-color: rgba(220, 163, 157, 0.68);
        background: rgba(255, 253, 249, 0.84);
      }

      .sentence-card blockquote {
        margin: 0;

        color: #5b4d48;
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.68;

        word-break: keep-all;
      }

      .sentence-card span {
        display: block;
        margin-top: 12px;

        color: var(--muted);
        font-size: 0.82rem;
      }

      /* =========================
         CONNECT
      ========================= */

      .footer {
        padding: 28px 0 0;

        border-top: 1px solid var(--line);

        color: var(--muted);

        text-align: center;
        font-size: 0.94rem;
      }

      /* =========================
         ACCESSIBILITY
      ========================= */

      .primary-link:focus-visible,
      .link-card:focus-visible,
      .sentence-card:focus-visible,
      .story-card:focus-visible {
        outline: 3px solid rgba(220, 163, 157, 0.34);
        outline-offset: 3px;
      }

      /* =========================
         DESKTOP
      ========================= */

      @media (min-width: 720px) {
        .page {
          padding-top: 42px;
          padding-bottom: 54px;
        }

        .hero {
          min-height: auto;
          padding-top: 18px;
          padding-bottom: 36px;
        }

        .name {
          font-size: 2.16rem;
        }
      }
    </style>
